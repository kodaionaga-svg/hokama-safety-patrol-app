<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>お知らせ・連絡掲示板</title>
  <style>
    :root{--navy:#123757;--line:#d7e2eb;--ink:#1e293b;--muted:#64748b;--red:#b91c1c}*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}header{background:var(--navy);color:#fff;padding:16px max(16px,calc((100% - 900px)/2))}h1{font-size:20px;margin:0}header p{font-size:12px;color:#c9deef;margin:4px 0 0}main{max-width:900px;margin:16px auto;padding:0 14px 90px}.bar,.card,.filters{background:#fff;border:1px solid var(--line);border-radius:12px}.bar,.filters{padding:12px;display:flex;gap:8px;align-items:center}.bar{justify-content:space-between}.filters{margin:12px 0;flex-wrap:wrap}button,input,select,textarea{font:inherit}button{border:0;border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:700;touch-action:manipulation}.primary{background:#1d6398;color:#fff}.secondary{background:#e8eef4;color:#274560}.danger{background:#fee2e2;color:#b91c1c}input,select,textarea{border:1px solid #cbd5e1;border-radius:8px;padding:10px;width:100%;background:#fff}input[type=search]{flex:1;min-width:170px}.cards{display:grid;gap:10px}.card{padding:14px;cursor:pointer}.card.pinned{border-left:5px solid #1d6398}.card.urgent{border-left:5px solid var(--red)}.head{display:flex;gap:8px;align-items:center;justify-content:space-between}.title{font-weight:800;font-size:16px;margin:8px 0}.sub{font-size:12px;color:var(--muted);line-height:1.6}.badge{font-size:11px;padding:4px 8px;border-radius:999px;background:#e8eef4;white-space:nowrap}.badge.important{background:#fef3c7;color:#92400e}.badge.urgent{background:#fee2e2;color:#b91c1c}.empty{text-align:center;color:var(--muted);padding:35px}.notice{font-size:12px;color:#075985;min-height:20px}dialog{width:min(680px,calc(100% - 24px));max-height:calc(100dvh - 24px);padding:0;border:0;border-radius:14px;box-shadow:0 20px 70px #0f172a77}dialog::backdrop{background:#0f172a80}.modal-head{background:var(--navy);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0;font-size:17px}.modal{padding:16px;overflow:auto;max-height:calc(100dvh - 160px)}label{display:block;font-weight:700;font-size:12px;color:#475569;margin:12px 0 5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}textarea{min-height:120px;resize:vertical}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.actions button{min-height:42px}.pin{color:#1d6398;font-size:12px;font-weight:700}@media(max-width:650px){header{position:sticky;top:0;z-index:3;padding:12px 14px}main{margin-top:12px;padding:0 12px}.bar{align-items:stretch;flex-direction:column}.bar button{min-height:48px}.filters{display:grid;grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.card{padding:13px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.modal{padding:14px}.actions{position:sticky;bottom:-14px;background:#fff;padding:12px 0 calc(12px + env(safe-area-inset-bottom))}.actions button{flex:1;min-height:48px}#newPost{position:fixed;right:16px;bottom:16px;z-index:4;border-radius:999px;min-height:54px;box-shadow:0 8px 22px #12375755}}
  </style>
</head>
<body>
  <header><h1>お知らせ・連絡掲示板</h1><p>連絡・周知・引継ぎを、現場全員で共有</p></header>
  <main>
    <section class="bar"><select id="project"></select><button id="manageProjects" class="secondary">工事名を管理</button><button id="newPost" class="primary">＋ 投稿する</button></section>
    <section class="filters"><input id="search" type="search" placeholder="タイトル・内容・担当者を検索"><select id="categoryFilter"><option value="">区分：すべて</option><option>今日の連絡</option><option>要確認・回答待ち</option><option>周知事項</option><option>引継ぎ</option><option>緊急連絡</option></select><select id="statusFilter"><option value="">状態：すべて</option><option>掲示中</option><option>確認済み</option><option>対応中</option><option>完了</option></select></section>
    <p id="notice" class="notice"></p><section id="cards" class="cards"></section>
  </main>
  <dialog id="postDialog"><div class="modal-head"><h2 id="dialogTitle">投稿する</h2><button id="closeDialog" class="secondary">×</button></div><form id="postForm" class="modal"><div class="grid"><div class="wide"><label>タイトル *</label><input id="title" required placeholder="例：明日のコンクリート打設時刻変更"></div><div><label>区分 *</label><select id="category"><option>今日の連絡</option><option>要確認・回答待ち</option><option>周知事項</option><option>引継ぎ</option><option>緊急連絡</option></select></div><div><label>重要度 *</label><select id="priority"><option>通常</option><option>重要</option><option>緊急</option></select></div><div><label>担当者</label><input id="assignee" placeholder="例：建築担当"></div><div><label>期限</label><input id="dueDate" type="date"></div><div><label>状態 *</label><select id="status"><option>掲示中</option><option>確認済み</option><option>対応中</option><option>完了</option></select></div><div><label><input id="pinned" type="checkbox" style="width:auto"> 上部に固定する</label></div><div class="wide"><label>内容 *</label><textarea id="body" required placeholder="変更内容、確認してほしいこと、次の行動を記入"></textarea></div></div><div class="actions"><button type="button" id="deletePost" class="danger" hidden>削除</button><button class="primary">保存する</button></div></form></dialog>
  <dialog id="projectDialog"><div class="modal-head"><h2>掲示板の工事名を管理</h2><button id="closeProjects" class="secondary">×</button></div><div class="modal"><div class="row"><input id="newProject" placeholder="新しい工事名"><button id="addProject" class="primary">追加</button></div><div id="projectList"></div></div></dialog>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function(){
    const db=window.supabase.createClient('https://schttjeinzdhjemgtdvi.supabase.co','sb_publishable_7HgyHI9HKDD5lvyPnX3tSA_ptePV39_');
    const $=id=>document.getElementById(id),esc=v=>String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    let projects=[],posts=[],activeProject='',editing=null,reloadTimer=null;
    const note=(t,e)=>{$('notice').textContent=t||'';$('notice').style.color=e?'#b91c1c':'#075985'};
    const date=v=>v?new Date(v+'T00:00:00').toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'}):'期限なし';
    function filters(){const q=$('search').value.toLowerCase(),c=$('categoryFilter').value,s=$('statusFilter').value;return posts.filter(x=>(!q||[x.title,x.body,x.assignee].join(' ').toLowerCase().includes(q))&&(!c||x.category===c)&&(!s||x.status===s));}
    function render(){const list=filters();$('cards').innerHTML=list.length?list.map(x=>'<article class="card '+(x.priority==='緊急'||x.category==='緊急連絡'?'urgent ':'')+(x.is_pinned?'pinned':'')+'" data-id="'+x.id+'"><div class="head"><span class="badge '+(x.priority==='緊急'?'urgent':x.priority==='重要'?'important':'')+'">'+esc(x.category)+'・'+esc(x.priority)+'</span><span class="badge">'+esc(x.status)+'</span></div><div class="title">'+(x.is_pinned?'<span class="pin">📌 固定　</span>':'')+esc(x.title)+'</div><div class="sub">担当：'+esc(x.assignee||'未設定')+'　期限：'+date(x.due_date)+'<br>'+esc(x.body).slice(0,90)+(x.body.length>90?'…':'')+'</div></article>').join(''):'<div class="empty">表示するお知らせはありません。</div>';$('cards').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(posts.find(x=>x.id===b.dataset.id)));}
    async function load(){note('共有データを読み込み中です。');const p=await db.from('notice_projects').select('*').order('created_at');if(p.error){note('工事の読込に失敗：'+p.error.message,true);return;}projects=p.data||[];$('project').innerHTML='<option value="">全工事</option>'+projects.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('');$('project').value=activeProject;renderProjectList();const q=db.from('site_announcements').select('*').order('is_pinned',{ascending:false}).order('created_at',{ascending:false});const r=activeProject?await q.eq('notice_project_id',activeProject):await q;if(r.error){note('掲示板の読込に失敗：'+r.error.message,true);return;}posts=r.data||[];render();note('');}
    function schedule(){clearTimeout(reloadTimer);reloadTimer=setTimeout(load,350)}
    function open(x){editing=x||null;$('postForm').reset();$('dialogTitle').textContent=x?'投稿を編集':'投稿する';$('deletePost').hidden=!x;if(x){$('title').value=x.title;$('category').value=x.category;$('priority').value=x.priority;$('assignee').value=x.assignee||'';$('dueDate').value=x.due_date||'';$('status').value=x.status;$('pinned').checked=x.is_pinned;$('body').value=x.body;}$('postDialog').showModal();}
    async function save(e){e.preventDefault();const d={notice_project_id:activeProject||null,title:$('title').value.trim(),category:$('category').value,priority:$('priority').value,assignee:$('assignee').value.trim()||null,due_date:$('dueDate').value||null,status:$('status').value,is_pinned:$('pinned').checked,body:$('body').value.trim(),updated_at:new Date().toISOString()};const r=editing?await db.from('site_announcements').update(d).eq('id',editing.id):await db.from('site_announcements').insert(d);if(r.error){note('保存に失敗：'+r.error.message,true);return;}$('postDialog').close();await load();}
    async function remove(){if(!editing||!confirm('この投稿を削除しますか？'))return;const r=await db.from('site_announcements').delete().eq('id',editing.id);if(r.error){note('削除に失敗：'+r.error.message,true);return;}$('postDialog').close();await load();}
    function renderProjectList(){$('projectList').innerHTML=projects.map(p=>'<div class="row" style="margin-top:8px"><input data-p="'+p.id+'" value="'+esc(p.name)+'"><button data-save="'+p.id+'" class="secondary">保存</button><button data-del="'+p.id+'" class="danger">削除</button></div>').join('');$('projectList').querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const name=$('projectList').querySelector('[data-p="'+b.dataset.save+'"]').value.trim();if(name)await db.from('notice_projects').update({name,updated_at:new Date().toISOString()}).eq('id',b.dataset.save);load()});$('projectList').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('この工事名を削除しますか？')){await db.from('notice_projects').delete().eq('id',b.dataset.del);if(activeProject===b.dataset.del)activeProject='';load()}})}
    $('newPost').onclick=()=>open();$('postForm').onsubmit=save;$('closeDialog').onclick=()=>$('postDialog').close();$('deletePost').onclick=remove;$('project').onchange=e=>{activeProject=e.target.value;load()};$('manageProjects').onclick=()=>$('projectDialog').showModal();$('closeProjects').onclick=()=>$('projectDialog').close();$('addProject').onclick=async()=>{const name=$('newProject').value.trim();if(!name)return;const r=await db.from('notice_projects').insert({name}).select().single();if(!r.error){activeProject=r.data.id;$('newProject').value='';await load()}};['search','categoryFilter','statusFilter'].forEach(id=>$(id).oninput=render);
    db.channel('notice-board-shared-sync').on('postgres_changes',{event:'*',schema:'public',table:'site_announcements'},schedule).on('postgres_changes',{event:'*',schema:'public',table:'notice_projects'},schedule).subscribe();document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});window.addEventListener('focus',load);load();
  })();
  </script>
</body></html>
