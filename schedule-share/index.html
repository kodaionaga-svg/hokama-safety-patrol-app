<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工程・予定共有</title><style>:root{--n:#123757;--l:#d7e2eb}*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#1e293b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}header{background:var(--n);color:#fff;padding:16px max(16px,calc((100% - 1000px)/2))}h1{margin:0;font-size:20px}p{font-size:12px}main{max-width:1000px;margin:16px auto;padding:0 14px 35px}.card{background:#fff;border:1px solid var(--l);border-radius:12px;padding:14px;margin-bottom:12px}select,input,button{font:inherit}select,input{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:11px}button{border:0;border-radius:8px;padding:11px 13px;cursor:pointer;font-weight:700;touch-action:manipulation}.primary{background:#1d6398;color:#fff}.secondary{background:#e8eef4;color:#274560}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1}.tabs .on{background:var(--n);color:#fff}.notice{min-height:20px;color:#075985}.tools{display:flex;gap:7px;align-items:center;justify-content:flex-end;margin-bottom:9px;flex-wrap:wrap}.tools button{padding:9px 11px;min-width:42px}.tools output{min-width:48px;text-align:center;font-weight:700;color:#274560}.viewer{height:min(74vh,780px);border:1px solid var(--l);border-radius:10px;overflow:hidden;background:#fff}.viewer:fullscreen{width:100%;height:100%;border:0;border-radius:0}.viewer iframe{width:100%;height:100%;border:0;touch-action:pan-x pan-y pinch-zoom}.empty{height:100%;display:grid;place-items:center;color:#64748b;text-align:center;padding:20px}@media(max-width:650px){header{position:sticky;top:0;z-index:2;padding:12px 14px}main{padding:0 12px;margin-top:12px}.row{display:grid;grid-template-columns:1fr}.row button{min-height:48px}.tabs button{min-height:46px;font-size:12px}.tools{justify-content:stretch}.tools button{min-height:44px;flex:1}.viewer{height:72dvh}.card{padding:12px}}</style></head><body><header><h1>工程・予定共有</h1><p>現場別の工程表PDFを、全員で閲覧・共有</p></header><main><section class="card"><div class="row"><select id="project"></select><button id="addProject" class="secondary">＋ 工事を追加・編集</button></div><p id="notice" class="notice"></p></section><section class="card"><b>工程表を更新</b><p>PDFのみ登録できます。更新すると、同じ現場を開いている全端末へ自動反映されます。</p><div class="row"><select id="type"><option>全体工程</option><option>月間工程</option><option>週間工程</option></select><input id="file" type="file" accept="application/pdf,.pdf"><button id="upload" class="primary">PDFを保存</button></div></section><section class="card"><div id="tabs" class="tabs"></div><div id="tools" class="tools" hidden><button id="zoomOut" class="secondary" aria-label="縮小">－</button><output id="zoomLabel">100%</output><button id="zoomIn" class="secondary" aria-label="拡大">＋</button><button id="fit" class="secondary">全体表示</button><button id="fullscreen" class="secondary">全画面</button><button id="download" class="primary">PDFをダウンロード</button></div><div id="viewer" class="viewer"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{const db=supabase.createClient('https://schttjeinzdhjemgtdvi.supabase.co','sb_publishable_7HgyHI9HKDD5lvyPnX3tSA_ptePV39_'),$=x=>document.getElementById(x),T=['全体工程','月間工程','週間工程'];let ps=[],rows=[],pid='',active='全体工程',timer,zoom=100,pdfUrl='',pdfName='工程表.pdf';const note=(x,e)=>{$('notice').textContent=x||'';$('notice').style.color=e?'#b91c1c':'#075985'},esc=x=>String(x||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function showPdf(){if(!pdfUrl)return;$('zoomLabel').value=zoom+'%';$('viewer').innerHTML='<iframe src="'+esc(pdfUrl)+'#view=FitH&zoom='+zoom+'" title="'+esc(active)+' PDF"></iframe>'}function setZoom(n){zoom=Math.max(50,Math.min(300,n));showPdf()}async function load(){const p=await db.from('schedule_projects').select('*').order('created_at');if(p.error)return note('現場一覧を読み込めません：'+p.error.message,true);ps=p.data||[];if(!ps.length){$('project').innerHTML='<option>現場を追加してください</option>';return}if(!ps.some(x=>x.id===pid))pid=ps[0].id;$('project').innerHTML=ps.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');$('project').value=pid;const r=await db.from('project_schedule_pdfs').select('*').eq('project_id',pid);if(r.error)return note('工程表を読み込めません：'+r.error.message,true);rows=r.data||[];render();note('')}async function render(){$('tabs').innerHTML=T.map(x=>'<button class="'+(x===active?'on':'secondary')+'" data-t="'+x+'">'+x+'</button>').join('');$('tabs').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{active=b.dataset.t;zoom=100;render()});const r=rows.find(x=>x.schedule_type===active);if(!r){pdfUrl='';$('tools').hidden=true;$('viewer').innerHTML='<div class="empty">'+active+'のPDFは未登録です。<br>上の「工程表を更新」から登録してください。</div>';return}const u=await db.storage.from('schedule-pdfs').createSignedUrl(r.storage_path,3600);if(u.error){$('tools').hidden=true;$('viewer').innerHTML='<div class="empty">PDFを開けませんでした。</div>';return}pdfUrl=u.data.signedUrl;pdfName=r.file_name||active+'.pdf';$('tools').hidden=false;showPdf()}async function upload(){if(!pid)return note('先に現場を選択してください。',true);const f=$('file').files[0];if(!f)return note('PDFを選択してください。',true);if(f.type!=='application/pdf'&&!/\.pdf$/i.test(f.name))return note('PDFファイルのみ登録できます。',true);const old=rows.find(x=>x.schedule_type===$('type').value),path='schedules/'+pid+'/'+Date.now()+'_'+f.name.replace(/[^A-Za-z0-9._-]/g,'_');note('PDFをクラウドへ保存中です。');const up=await db.storage.from('schedule-pdfs').upload(path,f,{upsert:false,contentType:'application/pdf'});if(up.error)return note('PDFの保存に失敗：'+up.error.message,true);const d={project_id:pid,schedule_type:$('type').value,file_name:f.name,storage_path:path,updated_at:new Date().toISOString()},q=old?db.from('project_schedule_pdfs').update(d).eq('id',old.id):db.from('project_schedule_pdfs').insert(d);const r=await q;if(r.error)return note('工程表の登録に失敗：'+r.error.message,true);if(old)await db.storage.from('schedule-pdfs').remove([old.storage_path]);active=d.schedule_type;$('file').value='';await load();note('保存しました。')}async function download(){if(!pdfUrl)return;note('PDFを準備しています。');try{const r=await fetch(pdfUrl);if(!r.ok)throw Error();const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download=pdfName;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);note('PDFをダウンロードしました。')}catch{note('PDFをダウンロードできませんでした。',true)}}$('project').onchange=e=>{pid=e.target.value;load()};$('upload').onclick=upload;$('zoomOut').onclick=()=>setZoom(zoom-25);$('zoomIn').onclick=()=>setZoom(zoom+25);$('fit').onclick=()=>setZoom(100);$('fullscreen').onclick=()=>{const v=$('viewer');document.fullscreenElement?document.exitFullscreen():v.requestFullscreen?.()};$('download').onclick=download;$('addProject').onclick=async()=>{const current=ps.find(x=>x.id===pid),n=prompt(current?'工事名を変更（新規追加は末尾の＋を使います）':'工事名を入力してください',current?.name||'');if(!n?.trim())return;const r=current?await db.from('schedule_projects').update({name:n.trim(),updated_at:new Date().toISOString()}).eq('id',pid):await db.from('schedule_projects').insert({name:n.trim()}).select().single();if(r.error)return note('工事名を保存できません：'+r.error.message,true);if(!current)pid=r.data.id;load()};const schedule=()=>{clearTimeout(timer);timer=setTimeout(load,350)};db.channel('schedule-pdf-sync').on('postgres_changes',{event:'*',schema:'public',table:'project_schedule_pdfs'},schedule).on('postgres_changes',{event:'*',schema:'public',table:'schedule_projects'},schedule).subscribe();document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});window.addEventListener('focus',load);load()})();</script></body></html>
